[package]
name = "tamper-audit"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["WyattAu"]
description = "Tamper-evident audit logging for Rust — SHA-256 chain, immutable entries, and queryable audit trail"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/auditlog"
keywords = ["audit", "logging", "tamper", "sha256", "security"]
categories = ["rust-patterns", "cryptography"]
exclude = ["/target"]
readme = "README.md"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"], optional = true }

[[bench]]
name = "auditlog_bench"
harness = false

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "test-util"] }

[features]
default = ["in-memory"]
in-memory = []
persistence = ["dep:sqlx"]
