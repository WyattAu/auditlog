[package]
name = "auditlog"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["WyattAu"]
description = "Tamper-evident audit logging for Rust — SHA-256 chain, immutable entries, and queryable audit trail"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/auditlog"
keywords = ["audit", "logging", "tamper", "sha256", "security"]
categories = ["rust-patterns", "cryptography"]
readme = "README.md"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[features]
default = ["in-memory"]
in-memory = []
persistence = []
